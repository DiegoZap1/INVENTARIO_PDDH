{% extends 'index.html' %}

{% block content %}
    <h1>Agregar Objeto al Inventario</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Agregar</button>
        <a href="{% url 'inventario' %}">Volver al Inventario</a>
    </form>
{% endblock %}
