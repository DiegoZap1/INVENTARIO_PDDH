<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>INVENTARIO PDDH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 10px 0;
    }
    .wrap {
      width: 80%;
      margin: 0 auto;
    }
    .grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background-color: #555;
      color: #fff;
      padding: 5px 10px;
      text-decoration: none;
      border-radius: 3px;
    }
    .btn:hover {
      background-color: #777;
    }
    main {
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap grid">
      <div>
        <a href="{% url 'inventario' %}"><h1>INVENTARIO PDDH</h1></a>
      </div>
      <div>
        <a class="btn" href="{% url 'agregar_objeto' %}">Agregar Objeto</a>
        <a class="btn" href="{% url 'exportar' %}">Exportar</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
