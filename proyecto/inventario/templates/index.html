{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>INVENTARIO PDDH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body>
  <header>
    <div class="wrap grid">
      <div>
        <a href="{% url 'inventario' %}" class="marca-institucional">
          <img src="{% static 'img/LOGO_PDDH.png' %}" alt="Logo PDDH" class="logo-pddh">
          <h1>INVENTARIO PDDH</h1>
        </a>
      </div>
      <div>
        <a class="btn" href="{% url 'agregar_objeto' %}">Agregar Objeto</a>
        <a class="btn" href="{% url 'exportar' %}">Exportar</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
